<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>爱娃披萨店手机扫码测试</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f5f2;
        --surface: #ffffff;
        --ink: #1f2b27;
        --muted: #63716b;
        --line: #dfe6df;
        --accent: #0f8a6b;
        --warm: #d9792d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(560px, 100%);
        display: grid;
        gap: 16px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 18px 60px rgba(35, 47, 42, 0.12);
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 26px;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
      }

      .qr {
        width: 260px;
        height: 260px;
        justify-self: center;
        border: 10px solid #fff;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      .url-box {
        display: grid;
        gap: 8px;
        padding: 12px;
        border-radius: 8px;
        background: #eef3ef;
      }

      a {
        color: var(--accent);
        overflow-wrap: anywhere;
        font-weight: 700;
      }

      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: #eef3ef;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        color: var(--ink);
        font: inherit;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: var(--accent);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      .warning {
        color: #8a4a07;
        background: #fff2dd;
        border-radius: 8px;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>手机扫码测试</h1>
      <p>手机和电脑需要连接同一个 Wi-Fi。推荐双击 <code>start-mobile-test.command</code>，它会自动识别电脑局域网 IP。</p>
      <p id="hostWarning" class="warning hidden"></p>

      <label>
        电脑局域网 IP
        <input id="lanIp" placeholder="例如 192.168.1.23">
      </label>
      <button id="refreshQr" type="button">生成手机二维码</button>

      <img id="qrImage" class="qr" alt="消费者点餐端二维码">
      <div class="url-box">
        <p>消费者端：</p>
        <a id="customerLink" href="#" target="_blank" rel="noreferrer"></a>
      </div>
      <div class="url-box">
        <p>店家后台：</p>
        <a id="adminLink" href="#" target="_blank" rel="noreferrer"></a>
      </div>
      <p>后台登录：<code>13800000000</code> / <code>123456</code></p>
    </main>

    <script>
      const port = window.location.port || "4173";
      const params = new URLSearchParams(window.location.search);
      const hostWarning = document.querySelector("#hostWarning");
      const lanIp = document.querySelector("#lanIp");
      const qrImage = document.querySelector("#qrImage");
      const customerLink = document.querySelector("#customerLink");
      const adminLink = document.querySelector("#adminLink");
      const refreshQr = document.querySelector("#refreshQr");

      function defaultIp() {
        if (params.get("ip")) return params.get("ip");
        const host = window.location.hostname;
        if (host && host !== "127.0.0.1" && host !== "localhost") return host;
        return "";
      }

      function updateQr() {
        const ip = lanIp.value.trim();
        if (!ip) {
          hostWarning.classList.remove("hidden");
          hostWarning.textContent = "当前页面不知道电脑的 Wi-Fi IP。请双击 start-mobile-test.command，或在这里输入电脑局域网 IP。";
          qrImage.removeAttribute("src");
          customerLink.textContent = "";
          adminLink.textContent = "";
          return;
        }

        hostWarning.classList.add("hidden");
        const customerUrl = `http://${ip}:${port}/customer.html?table=3&source=store_qr&local=1&localApi=1&mockAuth=1`;
        const adminUrl = `http://${ip}:${port}/index.html?local=1&localApi=1`;
        qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(customerUrl)}`;
        customerLink.href = customerUrl;
        customerLink.textContent = customerUrl;
        adminLink.href = adminUrl;
        adminLink.textContent = adminUrl;
      }

      lanIp.value = defaultIp();
      refreshQr.addEventListener("click", updateQr);
      updateQr();
    </script>
  </body>
</html>
