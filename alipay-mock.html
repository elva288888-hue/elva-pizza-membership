<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>支付宝支付模拟</title>
    <style>
      :root {
        color-scheme: light;
        --blue: #1677ff;
        --ink: #172033;
        --muted: #6b7280;
        --line: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 22px;
        color: var(--ink);
        background: #f4f8ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(420px, 100%);
        display: grid;
        gap: 18px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: white;
        box-shadow: 0 18px 50px rgba(22, 119, 255, 0.14);
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        color: var(--blue);
        font-size: 25px;
      }

      p {
        color: var(--muted);
        line-height: 1.55;
      }

      .amount {
        padding: 18px;
        border-radius: 10px;
        background: #eef5ff;
        text-align: center;
      }

      .amount strong {
        display: block;
        margin-top: 8px;
        color: var(--blue);
        font-size: 34px;
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: var(--blue);
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>支付宝支付模拟</h1>
      <p>本地测试中，这里代表跳转到支付宝 App 或外部浏览器后的支付页。正式上线时会替换为支付宝开放平台返回的真实支付页面。</p>
      <div class="amount">
        <span id="orderNo">订单</span>
        <strong id="amount">¥0.00</strong>
      </div>
      <button type="button" onclick="window.close()">完成并返回</button>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      document.querySelector("#orderNo").textContent = params.get("orderNo") || "测试订单";
      document.querySelector("#amount").textContent = `¥${params.get("amount") || "0.00"}`;
    </script>
  </body>
</html>
