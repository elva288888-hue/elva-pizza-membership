<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>爱娃披萨店会员管理</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" src="assets/aiwa-pizza-logo.jpg" alt="爱娃披萨店 logo">
          <div>
            <h1>爱娃披萨店</h1>
            <p>会员管理</p>
          </div>
        </div>

        <nav class="nav" aria-label="主导航">
          <button class="nav-item active" data-view="dashboard" type="button">总览</button>
          <button class="nav-item" data-view="members" type="button">会员</button>
          <button class="nav-item" data-view="records" type="button">流水</button>
          <button class="nav-item" data-view="settings" type="button">设置</button>
        </nav>

        <div class="sidebar-footer">
          <button id="exportData" class="ghost-button" type="button">导出数据</button>
          <label class="import-label">
            导入数据
            <input id="importData" type="file" accept="application/json">
          </label>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">会员与交易管理</p>
            <h2 id="pageTitle">总览</h2>
          </div>
          <button id="addMemberTop" class="primary-button" type="button">新增会员</button>
        </header>

        <section id="dashboardView" class="view active-view" aria-labelledby="pageTitle">
          <div class="metric-grid">
            <article class="metric-card">
              <span>会员数</span>
              <strong id="memberCount">0</strong>
            </article>
            <article class="metric-card">
              <span>总余额</span>
              <strong id="totalBalance">¥0.00</strong>
            </article>
            <article class="metric-card">
              <span>今日充值</span>
              <strong id="todayRecharge">¥0.00</strong>
            </article>
            <article class="metric-card">
              <span>今日消费</span>
              <strong id="todaySpend">¥0.00</strong>
            </article>
          </div>

          <div class="content-grid">
            <section class="panel">
              <div class="panel-head">
                <h3>快捷操作</h3>
              </div>
              <form id="quickTransactionForm" class="form-grid">
                <label>
                  会员
                  <select id="quickMember" required></select>
                </label>
                <label>
                  类型
                  <select id="quickType" required>
                    <option value="recharge">充值</option>
                    <option value="spend">消费</option>
                  </select>
                </label>
                <label>
                  金额
                  <input id="quickAmount" type="number" min="0.01" step="0.01" placeholder="例如 50" required>
                </label>
                <label>
                  备注
                  <input id="quickNote" type="text" placeholder="例如 奶茶 2 杯">
                </label>
                <div class="form-actions span-2">
                  <button class="ghost-button" type="submit" value="print" name="receiptAction">保存并打印</button>
                  <button class="primary-button" type="submit" value="save" name="receiptAction">保存流水</button>
                </div>
              </form>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3>最近流水</h3>
                <button class="text-button" data-view-jump="records" type="button">查看全部</button>
              </div>
              <div id="recentRecords" class="record-list empty-state">暂无记录</div>
            </section>
          </div>
        </section>

        <section id="membersView" class="view" aria-labelledby="pageTitle">
          <div class="toolbar">
            <input id="memberSearch" class="search-input" type="search" placeholder="搜索姓名、手机号或卡号">
            <button id="addMember" class="primary-button" type="button">新增会员</button>
          </div>
          <div id="memberList" class="member-list empty-state">暂无会员</div>
        </section>

        <section id="recordsView" class="view" aria-labelledby="pageTitle">
          <div class="toolbar">
            <input id="recordSearch" class="search-input" type="search" placeholder="搜索会员、备注、类型">
            <select id="recordTypeFilter" class="filter-select">
              <option value="all">全部类型</option>
              <option value="recharge">充值</option>
              <option value="spend">消费</option>
              <option value="adjust">调整</option>
            </select>
            <label class="date-filter">
              开始日期
              <input id="recordStartDate" type="date">
            </label>
            <label class="date-filter">
              结束日期
              <input id="recordEndDate" type="date">
            </label>
            <button id="clearRecordDates" class="ghost-button" type="button">清除日期</button>
            <button id="printFilteredRecords" class="primary-button" type="button">打印查询结果</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>时间</th>
                  <th>会员</th>
                  <th>类型</th>
                  <th>金额</th>
                  <th>赠送</th>
                  <th>余额</th>
                  <th>备注</th>
                </tr>
              </thead>
              <tbody id="recordTable"></tbody>
            </table>
          </div>
        </section>

        <section id="settingsView" class="view" aria-labelledby="pageTitle">
          <section class="panel settings-panel">
            <div class="panel-head">
              <h3>充值赠送规则</h3>
            </div>
            <form id="bonusRuleForm" class="form-grid">
              <label>
                充值满
                <input id="ruleMinAmount" type="number" min="0.01" step="0.01" placeholder="例如 100" required>
              </label>
              <label>
                赠送
                <input id="ruleBonusAmount" type="number" min="0" step="0.01" placeholder="例如 10" required>
              </label>
              <button class="primary-button span-2" type="submit">添加规则</button>
            </form>
            <div id="bonusRuleList" class="rule-list empty-state">暂无赠送规则</div>
          </section>
        </section>
      </main>
    </div>

    <dialog id="memberDialog" class="dialog">
      <form id="memberForm" method="dialog">
        <div class="dialog-head">
          <h3 id="memberDialogTitle">新增会员</h3>
          <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
        </div>
        <input id="memberId" type="hidden">
        <label>
          姓名
          <input id="memberName" type="text" placeholder="例如 张三" required>
        </label>
        <label>
          手机号
          <input id="memberPhone" type="tel" placeholder="例如 13800000000" required>
        </label>
        <label>
          卡号
          <input id="memberCard" type="text" placeholder="留空自动生成">
        </label>
        <label>
          初始余额
          <input id="memberBalance" type="number" min="0" step="0.01" value="0">
        </label>
        <label>
          备注
          <textarea id="memberNote" rows="3" placeholder="例如 常点少糖"></textarea>
        </label>
        <div class="dialog-actions">
          <button class="ghost-button" value="cancel" type="submit">取消</button>
          <button id="saveMember" class="primary-button" value="default" type="button">保存会员</button>
        </div>
      </form>
    </dialog>

    <section id="receiptPrintArea" class="receipt-print" aria-hidden="true"></section>

    <script src="app.js"></script>
  </body>
</html>
